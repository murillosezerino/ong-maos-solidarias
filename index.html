<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ONG Mãos Solidárias: segurança alimentar, educação e geração de renda.">
<title>ONG Mãos Solidárias</title>
<script>
(function () {
  var salvo = {};
  try { salvo = JSON.parse(localStorage.getItem('maos-solidarias:aparencia')) || {}; } catch (e) { salvo = {}; }
  var prefere = function (consulta) { return window.matchMedia && window.matchMedia(consulta).matches; };
  var raiz = document.documentElement;
  raiz.setAttribute('data-tema', salvo.tema || (prefere('(prefers-color-scheme: dark)') ? 'escuro' : 'claro'));
  raiz.setAttribute('data-contraste', salvo.contraste || (prefere('(prefers-contrast: more)') ? 'alto' : 'normal'));
})();
</script>
